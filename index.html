<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Assistance Congressional Outreach</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css?v=37">
</head>
<body>
  <header>
    <h1>Foreign Assistance Congressional Outreach</h1>
  </header>

  <main id="panels">
    <section id="committees" class="panel">
      <div class="panel-header">
        <h2>Committees</h2>
        <button type="button" id="committee-clear" class="panel-clear hidden" aria-label="Clear committee selection">Clear <span class="panel-clear-x">X</span></button>
      </div>
      <div class="panel-filters">
        <label><input type="radio" name="chamber" value="senate" checked> Senate</label>
        <label><input type="radio" name="chamber" value="house"> House</label>
        <label><input type="radio" name="chamber" value="both"> Both</label>
        <label><input type="checkbox" id="target-committees"> Target Committees</label>
        <span class="filter-count" id="committee-count"></span>
      </div>
      <div class="panel-content">
        <!-- committee list goes here -->
      </div>
    </section>

    <div class="resize-handle" data-resize="0"></div>

    <section id="members" class="panel">
      <h2>Legislators</h2>
      <div class="panel-filters">
        <label><input type="radio" name="party" value="all" checked> All</label>
        <label><input type="radio" name="party" value="D"> D</label>
        <label><input type="radio" name="party" value="R"> R</label>
        <label><input type="radio" name="party" value="I"> I</label>
        <span class="filter-count" id="member-count"></span>
      </div>
      <div class="panel-filters" id="state-filter">
        <label for="state-select">State</label>
        <select id="state-select">
          <option value="all">All</option>
        </select>
        <button type="button" id="state-clear" class="state-clear" aria-label="Clear state filter">X</button>
      </div>
      <div class="panel-search">
        <input type="text" id="member-search" placeholder="Search Members">
        <span class="search-icon">&#128269;</span>
        <ul id="member-search-results" class="search-results"></ul>
      </div>
      <div class="panel-content">
        <!-- member list goes here -->
      </div>
    </section>

    <div class="resize-handle" data-resize="1"></div>

    <section id="member" class="panel">
      <div class="member-panel-body">
        <div class="panel-content" id="member-detail">
          <p class="placeholder-text">Select a member to view details</p>
        </div>
        <div class="member-tabs-section">
          <div class="member-tabs" role="tablist">
            <button type="button" class="member-tab active" data-tab="staff" role="tab" aria-selected="true">
              Staff Directory
              <span class="member-tab-count" id="staff-table-count"></span>
            </button>
            <button type="button" class="member-tab" data-tab="committees" role="tab" aria-selected="false">
              Committees
              <span class="member-tab-count" id="member-committees-count"></span>
            </button>
            <button type="button" class="member-tab" data-tab="offices" role="tab" aria-selected="false">
              Offices
              <span class="member-tab-count" id="offices-table-count"></span>
            </button>
          </div>
          <div class="member-tab-panels">
            <div class="member-tab-panel" id="staff-table-wrap" data-panel="staff" role="tabpanel">
              <!-- staff table goes here -->
            </div>
            <div class="member-tab-panel hidden" id="member-committees-wrap" data-panel="committees" role="tabpanel">
              <!-- committees table goes here -->
            </div>
            <div class="member-tab-panel hidden" id="offices-table-wrap" data-panel="offices" role="tabpanel">
              <!-- offices go here -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/main.js?v=35"></script>
</body>
</html>
